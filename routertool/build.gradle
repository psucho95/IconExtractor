plugins {
    id 'com.android.application'
}

android {
    namespace 'com.psucho.routertool'
    compileSdk 35

    defaultConfig {
        applicationId 'com.psucho.routertool'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/*.md', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Maintained JSch fork: modern algorithms + optional legacy ssh-rsa for old Dropbear
    implementation 'com.github.mwiede:jsch:0.2.20'
}
